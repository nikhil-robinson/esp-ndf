<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14233d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7352c"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <!-- chip -->
  <g transform="translate(110,70)" stroke="url(#accent)" stroke-width="4" fill="none">
    <rect x="20" y="20" width="120" height="120" rx="10"/>
    <rect x="50" y="50" width="60" height="60" rx="4" fill="#e7352c" fill-opacity="0.15"/>
    <path d="M45 20V0M80 20V0M115 20V0M45 160V140M80 160V140M115 160V140M20 45H0M20 80H0M20 115H0M160 45H140M160 80H140M160 115H140" stroke-linecap="round"/>
  </g>
  <text x="340" y="140" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="84" font-weight="700" fill="#ffffff">esp-ndf</text>
  <text x="344" y="186" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="26" fill="#c9d4e5">Bare-metal SDK for the ESP32-S3 — no RTOS, no ESP-IDF, every line our own</text>
  <rect x="344" y="212" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="344" y="252" font-family="Consolas,Menlo,monospace" font-size="20" fill="#ff8a3d">46-cycle IRQ · 0 jitter · own BLE + Wi-Fi + TLS 1.3</text>
